name: Build and Test

on:
  push:
    branches: [ main, 'copilot/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Whitespace check against PR/merge base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            # For pushes, compare against the previous commit on this branch when available.
            BASE_REF="${{ github.event.before }}"
            if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1)"
            fi
          fi
          echo "Checking whitespace for range ${BASE_REF}...HEAD"
          git diff --check "${BASE_REF}"...HEAD

      - name: Restore dependencies
        run: dotnet restore DesktopAutomationHelper.slnx

      - name: Build solution
        run: dotnet build DesktopAutomationHelper.slnx --configuration Release --no-restore

      - name: Run driver tests
        run: >
          dotnet test
          src/DesktopAutomationDriver.Tests/DesktopAutomationDriver.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=DriverTestResults.trx"

      - name: Run agent tests
        run: >
          dotnet test
          src/DesktopAutomationAgent.Tests/DesktopAutomationAgent.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=AgentTestResults.trx"

      - name: Run desktop runtime tests
        run: >
          dotnet test
          src/DesktopExecutionRuntime.Tests/DesktopExecutionRuntime.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=RuntimeTestResults.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  publish-exe:
    name: Publish Standalone Packages (Windows)
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish driver (win-x64 standalone)
        run: >
          dotnet publish
          src/DesktopAutomationDriver/DesktopAutomationDriver.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=0.0.0-ci
          -p:InformationalVersion=0.0.0-ci
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output ./publish/driver

      - name: Publish agent (win-x64 standalone)
        run: >
          dotnet publish
          src/DesktopAutomationAgent/DesktopAutomationAgent.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=0.0.0-ci
          -p:InformationalVersion=0.0.0-ci
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output ./publish/agent

      - name: Verify publish version metadata (not filename-only)
        shell: pwsh
        run: |
          $expected = "0.0.0-ci"
          function Assert-ProductVersion([string]$path) {
            if (-not (Test-Path $path)) { throw "Missing published file: $path" }
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $path))
            $product = $info.ProductVersion
            if ($product -ne $expected) {
              throw "Expected ProductVersion '$expected' for $path but was '$product'"
            }
            Write-Host "OK $path ProductVersion=$product"
          }
          Assert-ProductVersion "./publish/driver/DesktopAutomationDriver.exe"
          Assert-ProductVersion "./publish/agent/DesktopAutomationAgent.exe"
          if (-not (Test-Path "./publish/agent/appsettings.json")) {
            throw "Agent publish output missing appsettings.json"
          }
          if (Test-Path "./publish/agent/DesktopAutomationAgent.pdb") {
            throw "Agent publish unexpectedly includes a PDB; release packaging must exclude debug symbols"
          }

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAutomationDriver-win-x64
          path: ./publish/driver/DesktopAutomationDriver.exe

      - name: Publish experimental runtime diagnostics CLI
        run: >
          dotnet publish
          src/DesktopRuntime/DesktopRuntime.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version=0.0.0-ci
          -p:InformationalVersion=0.0.0-ci
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output ./publish/runtime

      - name: Smoke test published runtime diagnostics
        shell: pwsh
        run: |
          & ./publish/runtime/DesktopRuntime.exe doctor --json > ./publish/runtime/runtime.json
          $doctorExit = $LASTEXITCODE
          if ($doctorExit -notin @(0, 2)) { throw "Unexpected doctor exit: $doctorExit" }
          $report = Get-Content ./publish/runtime/runtime.json -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne '1.0') { throw "Unexpected diagnostics schema" }
          if (-not $report.snapshot.isWindows) { throw "Windows probe was not executed" }
          if (($doctorExit -eq 0) -ne $report.preflightPassed) { throw "Exit code/report mismatch" }
          # A noninteractive CI session may correctly return a blocked preflight.
          exit 0

      - name: Upload experimental runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopRuntime-experimental-win-x64
          path: |
            ./publish/runtime/DesktopRuntime.exe
            ./publish/runtime/runtime.json

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAutomationAgent-win-x64
          path: |
            ./publish/agent/DesktopAutomationAgent.exe
            ./publish/agent/appsettings.json

  runtime-portable-tests:
    name: Runtime Contracts (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test portable policy and unsupported-platform behavior
        run: dotnet test src/DesktopExecutionRuntime.Tests/DesktopExecutionRuntime.Tests.csproj --configuration Release --logger "trx;LogFileName=RuntimeLinux.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-linux-test-results
          path: '**/RuntimeLinux.trx'

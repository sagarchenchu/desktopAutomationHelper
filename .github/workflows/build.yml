name: Build and Test

on:
  push:
    branches: [ main, 'copilot/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DesktopAutomationHelper.slnx

      - name: Build solution
        run: dotnet build DesktopAutomationHelper.slnx --configuration Release --no-restore

      - name: Run driver tests
        run: >
          dotnet test
          src/DesktopAutomationDriver.Tests/DesktopAutomationDriver.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=DriverTestResults.trx"

      - name: Run agent tests
        run: >
          dotnet test
          src/DesktopAutomationAgent.Tests/DesktopAutomationAgent.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=AgentTestResults.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  publish-exe:
    name: Publish Standalone Packages (Windows)
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish driver (win-x64 standalone)
        run: >
          dotnet publish
          src/DesktopAutomationDriver/DesktopAutomationDriver.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=0.0.0-ci
          -p:InformationalVersion=0.0.0-ci
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output ./publish/driver

      - name: Publish agent (win-x64 standalone)
        run: >
          dotnet publish
          src/DesktopAutomationAgent/DesktopAutomationAgent.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:Version=0.0.0-ci
          -p:InformationalVersion=0.0.0-ci
          -p:IncludeSourceRevisionInInformationalVersion=false
          --output ./publish/agent

      - name: Verify publish version metadata (not filename-only)
        shell: pwsh
        run: |
          $expected = "0.0.0-ci"
          function Assert-ProductVersion([string]$path) {
            if (-not (Test-Path $path)) { throw "Missing published file: $path" }
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $path))
            $product = $info.ProductVersion
            if ([string]::IsNullOrWhiteSpace($product) -or -not $product.StartsWith($expected)) {
              throw "Expected ProductVersion to start with '$expected' for $path but was '$product'"
            }
            Write-Host "OK $path ProductVersion=$product"
          }
          Assert-ProductVersion "./publish/driver/DesktopAutomationDriver.exe"
          Assert-ProductVersion "./publish/agent/DesktopAutomationAgent.exe"
          if (-not (Test-Path "./publish/agent/appsettings.json")) {
            throw "Agent publish output missing appsettings.json"
          }

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAutomationDriver-win-x64
          path: ./publish/driver/DesktopAutomationDriver.exe

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAutomationAgent-win-x64
          path: |
            ./publish/agent/DesktopAutomationAgent.exe
            ./publish/agent/appsettings.json
            ./publish/agent/**
